<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Events / Advanced - Market Events Radar</title>
    <link rel="stylesheet" href="/frontend/styles.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js'></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Market Events Radar</h1>
            <div id="status-bar" class="status-bar">Loading...</div>
            <button id="theme-toggle" class="theme-toggle">🌙 Dark</button>
        </header>

        <nav class="tabs">
            <button class="tab-button active" data-tab="events">Events</button>
            <button class="tab-button" data-tab="notifications">Notifications</button>
            <button class="tab-button" data-tab="settings">Settings</button>
        </nav>

        <div id="events-tab" class="tab-content active">
            <div class="zone-page-header">
                <a href="/" class="back-link">← Back to Home</a>
                <h2>All Events / Advanced</h2>
                <p class="zone-page-description">Full event catalog with powerful filtering</p>
            </div>

            <div class="controls sticky-controls">
                <div class="filter-group basic-filters">
                    <input type="text" id="search-input" placeholder="Search events..." class="search-box">
                    <select id="topic-filter" class="select-box">
                        <option value="all">All Topics</option>
                    </select>
                    <select id="days-ahead-select" class="select-box">
                        <option value="7">Next 7 days</option>
                        <option value="14">Next 14 days</option>
                        <option value="30">Next 30 days</option>
                        <option value="90">Next 90 days</option>
                        <option value="180">Next 180 days</option>
                        <option value="365" selected>Next 365 days</option>
                    </select>
                    <select id="format-filter" class="select-box">
                        <option value="">All Formats</option>
                        <option value="Webinar">Webinar</option>
                        <option value="Conference">Conference</option>
                        <option value="Panel">Panel</option>
                        <option value="Roundtable">Roundtable</option>
                        <option value="Forum">Forum</option>
                        <option value="Seminar">Seminar</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Symposium">Symposium</option>
                    </select>
                </div>
                
                <div class="filter-group advanced-filters">
                    <button class="filter-group-toggle" data-group="advanced" type="button">
                        <span>Advanced Filters</span>
                        <span class="toggle-icon">▶</span>
                    </button>
                    <div class="filter-group-content" id="advanced-filters-content" style="display: none;">
                        <div class="firm-filter-wrapper">
                            <button id="firm-filter-btn" class="select-box firm-filter-btn">Firms: All</button>
                            <div id="firm-filter-dropdown" class="firm-filter-dropdown" style="display: none;">
                                <div class="firm-filter-actions">
                                    <button id="firm-select-all" class="firm-filter-action-btn">Select All</button>
                                    <button id="firm-clear-all" class="firm-filter-action-btn">Clear</button>
                                </div>
                                <div id="firm-filter-checklist" class="firm-filter-checklist"></div>
                            </div>
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" id="with-date-checkbox" checked>
                            Only show events with date
                        </label>
                        <select id="theme-filter" class="select-box">
                            <option value="">All Themes</option>
                        </select>
                        <select id="type-filter" class="select-box">
                            <option value="">All Types</option>
                            <option value="event">Events</option>
                            <option value="briefing">Briefings</option>
                            <option value="outlook">Outlooks</option>
                            <option value="webinar">Webinars</option>
                            <option value="debate">Debates</option>
                            <option value="signal">Signals</option>
                        </select>
                        <select id="signal-filter" class="select-box">
                            <option value="">All Signals</option>
                            <option value="70">High (70+)</option>
                            <option value="60">Medium+ (60+)</option>
                            <option value="50">All Scored</option>
                        </select>
                        <input type="date" id="date-start" class="select-box" placeholder="Start Date" />
                        <input type="date" id="date-end" class="select-box" placeholder="End Date" />
                        <div class="tag-filter-wrapper">
                            <button id="tag-filter-btn" class="select-box">Tags: All</button>
                            <div id="tag-filter-dropdown" class="tag-filter-dropdown" style="display: none;"></div>
                        </div>
                    </div>
                </div>
                
                <div class="filter-group view-options">
                    <button class="filter-group-toggle" data-group="view" type="button">
                        <span>View Options</span>
                        <span class="toggle-icon">▶</span>
                    </button>
                    <div class="filter-group-content" id="view-options-content" style="display: none;">
                        <select id="sort-select" class="select-box">
                            <option value="date-asc">Date ↑</option>
                            <option value="date-desc">Date ↓</option>
                            <option value="signal-desc">Signal ↓</option>
                            <option value="newest">Newest</option>
                        </select>
                        <div class="view-toggle">
                            <button id="list-view-btn" class="view-btn active">List</button>
                            <button id="calendar-view-btn" class="view-btn">Calendar</button>
                        </div>
                        <button id="export-csv-btn" class="button">Export CSV</button>
                        <div class="saved-searches-wrapper">
                            <select id="saved-searches-list" class="select-box">
                                <option value="">Load saved search...</option>
                            </select>
                            <button id="save-search-btn" class="button small">Save Search</button>
                            <button id="delete-search-btn" class="button small">Delete</button>
                        </div>
                    </div>
                </div>
                
                <button id="run-scrape-btn" class="button">Run scrape now</button>
            </div>
            
            <div id="calendar-container" style="display: none;"></div>
            <div id="events-list" class="events-list">
                <p class="loading">Loading events...</p>
            </div>
        </div>

        <div id="notifications-tab" class="tab-content">
            <div class="controls">
                <button id="mark-all-seen-btn" class="button">Mark all seen</button>
            </div>
            <div id="notifications-list" class="notifications-list">
                <p class="loading">Loading notifications...</p>
            </div>
        </div>

        <div id="settings-tab" class="tab-content">
            <div id="settings-content" class="settings-content">
                <p class="loading">Loading settings...</p>
            </div>
        </div>
    </div>

    <script src="/frontend/app.js"></script>
    <script>
        // Zone 4 initialization
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.protocol === 'file:') return;
            
            // Determine zone number from pathname
            const zoneMatch = window.location.pathname.match(/\/zone(\d)/);
            if (zoneMatch) {
                initializeZonePage(parseInt(zoneMatch[1]));
            }
        });
    </script>
</body>
</html>
