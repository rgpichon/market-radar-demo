    async function generateThemeBrief(themeId, themeName, articles) {
      _currentThemeArticles = Array.isArray(articles) ? articles : [];

      const expanded = document.getElementById("theme-brief-expanded");
      const subtitle = document.getElementById("theme-brief-subtitle");
      const timeEl = document.getElementById("theme-brief-time");
      const read = document.getElementById("theme-brief-read");
      const collapsed = document.getElementById("theme-brief-collapsed");
      const title = document.getElementById("theme-brief-title");
      const textEl = document.getElementById("theme-brief-text");
      const citationsEl = document.getElementById("theme-brief-citations");
      if (!expanded || !subtitle || !title || !textEl || !citationsEl) return;

      _themeBriefExpanded = false;
      _themeBriefLoading = true;
      clearInterval(_themeBriefLoadingTimer);
      expanded.style.display = "none";
      if (read) {
        read.textContent = "Read brief →";
        read.style.color = "#ccc";
        read.style.pointerEvents = "none";
      }
      title.textContent = `AI Briefing: ${themeName || "Theme"}`;
      if (timeEl) timeEl.textContent = "Generating...";
      textEl.textContent = "";
      citationsEl.textContent = "";
      let dotIdx = 0;
      const loadingFrames = ["Analysing sources", "Analysing sources.", "Analysing sources..", "Analysing sources..."];
      subtitle.textContent = loadingFrames[0];
      _themeBriefLoadingTimer = setInterval(() => {
        dotIdx = (dotIdx + 1) % loadingFrames.length;
        subtitle.textContent = loadingFrames[dotIdx];
      }, 450);

      try {
        const topArticles = _currentThemeArticles.slice(0, 15).map((a) => ({
          title: a.title || "",
          summary: String(a.summary || "").substring(0, 200),
          source_name: a.source_name || "",
          date_published: String(a.date_published || "").substring(0, 10),
          sentiment: a.sentiment || "neutral",
        }));

        const res = await fetch("/api/signals/theme-brief", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ themeId, themeName, articles: topArticles }),
        });
        const data = await res.json();

        if (data.error) {
          clearInterval(_themeBriefLoadingTimer);
          _themeBriefLoading = false;
          subtitle.textContent = "Generation failed.";
          if (timeEl) timeEl.textContent = "--:--";
          return;
        }

        _currentThemeBriefData = data;
        clearInterval(_themeBriefLoadingTimer);
        _themeBriefLoading = false;
        subtitle.textContent = extractBriefSubtitle(data.brief);
        if (timeEl) {
          timeEl.textContent = new Date(data.generated_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        }
        if (read) {
          read.style.display = "block";
          read.style.color = "#c8102e";
          read.style.pointerEvents = "auto";
        }
        if (collapsed) {
          collapsed.setAttribute("role", "button");
          collapsed.setAttribute("tabindex", "0");
          collapsed.style.cursor = "pointer";
          collapsed.onclick = toggleThemeBrief;
          collapsed.onkeydown = (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggleThemeBrief();
            }
          };
        }
        function linkifyCitations(text, articleList) {
          return String(text || "").replace(/\[(\d+)\]/g, (match, num) => {
            const idx = parseInt(num, 10) - 1;
            if (idx >= 0 && idx < articleList.length) {
              const source = articleList[idx].source_name || "?";
              const url = articleList[idx].source_url || "#";
              const title = (articleList[idx].title || "").substring(0, 60);
              return `<sup><a href="${_escapeAttr(url)}" target="_blank" title="${escHtml(source)}: ${escHtml(title)}" style="color:#c8102e; text-decoration:none; font-family:'DM Mono', monospace; font-size:9px; font-weight:600;">[${num}]</a></sup>`;
            }
            return match;
          });
        }

        textEl.innerHTML = linkifyCitations(data.brief, _currentThemeArticles);

        const validCited = Array.isArray(data.cited_indices)
          ? data.cited_indices.filter((i) => Number.isInteger(i))
          : [];
        const indices = validCited.length > 0 ? validCited : [0, 1, 2, 3, 4];
        const citedSources = indices
          .filter((i) => i < _currentThemeArticles.length)
          .map((i) => {
            const a = _currentThemeArticles[i] || {};
            const url = a.source_url || a.url || "#";
            const name = a.source_name || a.source || "?";
            return `<a href="${_escapeAttr(url)}" target="_blank" style="color:#888; text-decoration:none;" onmouseover="this.style.color='#c8102e'" onmouseout="this.style.color='#888'">[${i + 1}] ${escHtml(name)}</a>`;
          })
          .join("  ·  ");
        citationsEl.innerHTML = "Sources: " + citedSources;
      } catch (e) {
        clearInterval(_themeBriefLoadingTimer);
        _themeBriefLoading = false;
        subtitle.textContent = "Generation error.";
        if (timeEl) timeEl.textContent = "--:--";
        console.error("Brief generation error:", e);
      }
    }

    async function generateNewsSectorBrief(sectorName) {
      const card = document.getElementById("news-brief-card");
      if (!card) return;
      if (!sectorName || sectorName === "All topics") {
        clearInterval(_newsBriefLoadingTimer);
        _newsBriefLoading = false;
        card.style.display = "none";
        return;
      }

      _newsBriefExpanded = false;
      _newsBriefLoading = true;
      clearInterval(_newsBriefLoadingTimer);
      card.style.display = "block";
      card.innerHTML = `
        <div style="border:1px solid #e8e4dc; background:#fff;">
          <div id="news-brief-collapsed" role="button" tabindex="0" onclick="toggleNewsBrief()" onkeydown="if(event.key==='Enter' || event.key===' '){event.preventDefault();toggleNewsBrief();}" style="padding:16px 20px; cursor:pointer;">
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font-family:'DM Mono',monospace; font-size:10px; color:#c8102e; font-weight:600;">AI BRIEF</span>
              <span style="font-family:'DM Sans',sans-serif; font-size:10px; color:#aaa;">·</span>
              <span style="font-family:'DM Sans',sans-serif; font-size:10px; color:#888;">${escHtml(sectorName)}</span>
              <span style="font-family:'DM Sans',sans-serif; font-size:10px; color:#aaa;">·</span>
              <span id="news-brief-time" style="font-family:'DM Mono',monospace; font-size:10px; color:#aaa;">Generating...</span>
            </div>
            <div id="news-brief-title" style="margin-top:8px; font-family:'Playfair Display',serif; font-size:20px; font-weight:400; color:#2a2a2a;">
              AI Briefing: ${escHtml(sectorName)}
            </div>
            <div id="news-brief-subtitle" style="margin-top:6px; font-family:'DM Sans',sans-serif; font-size:13px; color:#666; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
              Analysing sources
            </div>
            <div id="news-brief-read" style="margin-top:12px; font-family:'DM Sans',sans-serif; font-size:12px; color:#ccc; pointer-events:none;">
              Read brief →
            </div>
          </div>
          <div id="news-brief-expanded" style="display:none; padding:0 20px 16px 20px;">
            <div style="border-top:1px solid #e8e4dc; margin:12px 0;"></div>
            <div id="news-brief-text" style="font-family:'DM Sans',sans-serif; font-size:13px; color:#2a2a2a; line-height:1.7; white-space:pre-wrap; margin-bottom:12px;"></div>
            <div id="news-brief-citations" style="font-family:'DM Mono',monospace; font-size:10px; color:#aaa; border-top:1px solid #e8e4dc; padding-top:8px;"></div>
            <div style="text-align:right; margin-top:8px;">
              <button onclick="generateNewsSectorBrief('${_escapeAttr(sectorName)}')" style="font-family:'DM Sans',sans-serif; font-size:11px; color:#c8102e; background:none; border:none; cursor:pointer; padding:0;">
                ↻ Regenerate
              </button>
            </div>
          </div>
        </div>`;
      const newsSubtitleEl = document.getElementById("news-brief-subtitle");
      let newsDotIdx = 0;
      const loadingFrames = ["Analysing sources", "Analysing sources.", "Analysing sources..", "Analysing sources..."];
      _newsBriefLoadingTimer = setInterval(() => {
        if (newsSubtitleEl) {
          newsDotIdx = (newsDotIdx + 1) % loadingFrames.length;
          newsSubtitleEl.textContent = loadingFrames[newsDotIdx];
        }
      }, 450);

      try {
        let articles = _collectNewsBriefArticles(sectorName, 15);
        if (articles.length === 0 || !articles[0].title) {
          const r = await fetch(`/api/news/feed?topic=${encodeURIComponent(sectorName)}&limit=15`);
          const d = await r.json();
          const items = Array.isArray(d) ? d : (d.items || d.feed || []);
          articles = items.slice(0, 15).map((i) => ({
            title: i.title || "",
            summary: i.description || i.summary || "",
            source_name: i.source_name || "",
            date_published: i.date_published || "",
            sentiment: i.sentiment || "neutral",
            source_url: i.url || i.source_url || "#",
          }));
        }

        if (articles.length === 0) {
          clearInterval(_newsBriefLoadingTimer);
          _newsBriefLoading = false;
          card.style.display = "none";
          return;
        }

        const r = await fetch("/api/signals/theme-brief", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            themeId: sectorName,
            themeName: sectorName,
            articles,
          }),
        });
        const data = await r.json();
        if (data.error) {
          clearInterval(_newsBriefLoadingTimer);
          _newsBriefLoading = false;
          const subtitleEl = document.getElementById("news-brief-subtitle");
          const timeEl = document.getElementById("news-brief-time");
          if (subtitleEl) subtitleEl.textContent = "Brief generation failed.";
          if (timeEl) timeEl.textContent = "--:--";
          return;
        }

        const validCited = Array.isArray(data.cited_indices)
          ? data.cited_indices.filter((i) => Number.isInteger(i))
          : [];
        const indices = validCited.length > 0 ? validCited : [0, 1, 2, 3, 4];
        const citedLinks = indices
          .filter((i) => i < articles.length)
          .map((i) => {
            const a = articles[i];
            const url = a.source_url || a.url || "#";
            const name = a.source_name || a.source || "?";
            return `<a href="${_escapeAttr(url)}" target="_blank" style="color:#888;text-decoration:none;" onmouseover="this.style.color='#c8102e'" onmouseout="this.style.color='#888'">[${i + 1}] ${escHtml(name)}</a>`;
          })
          .join("  ·  ");

        function linkify(text, arts) {
          return String(text || "").replace(/\[(\d+)\]/g, (m, n) => {
            const idx = parseInt(n, 10) - 1;
            if (idx >= 0 && idx < arts.length) {
              const url = arts[idx].source_url || "#";
              const src = arts[idx].source_name || "?";
              return `<sup><a href="${_escapeAttr(url)}" target="_blank" title="${escHtml(src)}" style="color:#c8102e;text-decoration:none; font-family:'DM Mono',monospace;font-size:9px; font-weight:600;">[${n}]</a></sup>`;
            }
            return m;
          });
        }

        clearInterval(_newsBriefLoadingTimer);
        _newsBriefLoading = false;
        const readEl = document.getElementById("news-brief-read");
        const subtitleEl = document.getElementById("news-brief-subtitle");
        const timeEl = document.getElementById("news-brief-time");
        const textEl = document.getElementById("news-brief-text");
        const citationsEl = document.getElementById("news-brief-citations");
        if (readEl) {
          readEl.style.color = "#c8102e";
          readEl.style.pointerEvents = "auto";
          readEl.textContent = "Read brief →";
        }
        if (subtitleEl) subtitleEl.textContent = extractBriefSubtitle(data.brief);
        if (timeEl) {
          timeEl.textContent = new Date(data.generated_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        }
        if (textEl) textEl.innerHTML = linkify(data.brief, articles);
        if (citationsEl) citationsEl.innerHTML = `Sources: ${citedLinks}`;
      } catch (e) {
        clearInterval(_newsBriefLoadingTimer);
        _newsBriefLoading = false;
        const subtitleEl = document.getElementById("news-brief-subtitle");
        const timeEl = document.getElementById("news-brief-time");
        if (subtitleEl) subtitleEl.textContent = "Brief generation error.";
        if (timeEl) timeEl.textContent = "--:--";
        console.error("News brief error:", e);
      }
    }

    async function regenerateThemeBrief() {
      if (!openThemeId || !openThemeName) return;
      await generateThemeBrief(openThemeId, openThemeName, _currentThemeArticles);
    }

    function _convictionBadgeHtml(conviction) {
      if (conviction === "high") {
        return '<span style="font-family:\'DM Mono\',monospace; font-size:10px; color:#2e7d32;">● high</span>';
      }
      if (conviction === "medium") {
        return '<span style="font-family:\'DM Mono\',monospace; font-size:10px; color:#e8a000;">● med</span>';
      }
      return '<span style="font-family:\'DM Mono\',monospace; font-size:10px; color:#888;">● low</span>';
    }

    function _subSectorLabel(subKey) {
      if (subKey === "ai_infrastructure") return "AI Infrastructure";
      if (subKey === "ai_platforms") return "AI Platforms";
      if (subKey === "ai_enterprise") return "AI Enterprise";
      return subKey.replace(/_/g, " ");
    }

    function _detailSectionHeader(title, withTopMargin = true) {
      return `
        <div style="
          font-family:'DM Sans',sans-serif;
          font-size:10px;
          font-weight:600;
          letter-spacing:0.08em;
          color:#888;
          text-transform:uppercase;
          margin-bottom:12px;
          margin-top:${withTopMargin ? "24px" : "0"};
        ">${escHtml(title)}</div>
      `;
    }

    function _directionColor(direction) {
      if (direction === "bullish") return "#2e7d32";
      if (direction === "bearish") return "#c8102e";
      return "#aaa";
    }

    function _scoreColor(score) {
      if (Math.abs(score) < 0.05) return "#888";
      return score > 0 ? "#2e7d32" : "#c8102e";
    }

    function _formatWeekLabel(isoDate) {
      const d = new Date(`${isoDate}T00:00:00`);
      if (Number.isNaN(d.getTime())) return isoDate;
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function _chartFillColor(direction) {
      if (direction === "bullish") return "rgba(46,125,50,0.08)";
      if (direction === "bearish") return "rgba(200,16,46,0.08)";
      return "rgba(170,170,170,0.08)";
    }

    function _ensureChartJsLoaded() {
      if (window.Chart) return Promise.resolve();
      if (window._chartJsPromise) return window._chartJsPromise;
      window._chartJsPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js";
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Failed to load Chart.js"));
        document.head.appendChild(script);
      });
      return window._chartJsPromise;
    }

    function _destroySectorTrendChart() {
      if (window._sectorTrendChart) {
        window._sectorTrendChart.destroy();
        window._sectorTrendChart = null;
      }
    }

    function _classifyEvidenceDirection(text, sectorDirection) {
      const t = String(text || "").toLowerCase();
      const bullSignals = ["rise", "rises", "gain", "gains", "beat", "beats", "upgrade", "strong", "growth", "record", "surge"];
      const bearSignals = ["fall", "falls", "drop", "drops", "cut", "cuts", "downgrade", "weak", "decline", "risk", "warning", "warns"];
      if (bullSignals.some((k) => t.includes(k))) return "bullish";
      if (bearSignals.some((k) => t.includes(k))) return "bearish";
      return sectorDirection === "neutral" ? "neutral" : sectorDirection;
    }

    function _renderBullBearItems(s, direction) {
      const sectorDirection = String(s.direction || "neutral");
      const source = (s.sample_evidence || []).map((title) => ({
        type: "evidence",
        title: String(title || ""),
        direction: _classifyEvidenceDirection(title, sectorDirection),
      }));
      const themes = (s.themes_detail || [])
        .filter((t) => String(t.direction || "neutral") === direction)
        .map((t) => ({
          type: "theme",
          title: String(t.name || ""),
          articleCount: Number(t.article_count || 0),
          direction,
        }));

      const picked = [
        ...source.filter((it) => it.direction === direction),
        ...themes,
      ].slice(0, 8);

      if (!picked.length) {
        return '<div style="font-family:\'DM Mono\',monospace; font-size:11px; color:#aaa;">No supporting items</div>';
      }

      return picked.map((it) => {
        if (it.type === "theme") {
          return `
            <div style="font-family:'DM Sans',sans-serif; font-size:12px; color:#2a2a2a; margin-bottom:8px;">
              <span style="font-style:italic;">${escHtml(it.title)}</span>
              <span style="color:#888;"> (${Number(it.articleCount || 0)} articles)</span>
            </div>
          `;
        }
        const barColor = direction === "bullish" ? "#2e7d32" : "#c8102e";
        return `
          <div style="border-left:2px solid ${barColor}; padding-left:8px; margin-bottom:10px;">
            <div style="font-family:'DM Sans',sans-serif; font-size:12px; color:#2a2a2a; line-height:1.45;">
              ${escHtml(it.title)}
            </div>
          </div>
        `;
      }).join("");
    }

    function _insertPanelAfterRow(sectorKey, rowEl, panelEl) {
      const container = document.getElementById("scorecard-rows");
      if (!container) return;
      if (sectorKey === "technology") {
        const techSub = document.getElementById("subsector-rows-technology");
        if (techSub && techSub.parentNode === container) {
          container.insertBefore(panelEl, techSub.nextSibling);
          return;
        }
      }
      container.insertBefore(panelEl, rowEl.nextSibling);
    }

    function _buildSectorDetailPanel(sectorKey, s) {
      const panel = document.createElement("div");
      panel.className = "sector-detail-panel";
      panel.dataset.sectorPanel = sectorKey;
      panel.style.cssText = `
        background:#faf8f4;
        border-bottom:1px solid #e8e4dc;
        padding:0;
        opacity:0;
        max-height:0;
        overflow:hidden;
        transition:max-height 200ms ease, opacity 200ms ease, padding 200ms ease;
      `;

      const score = Number(s.score || 0);
      const scoreColor = Math.abs(score) < 0.05 ? "#888" : score > 0 ? "#2e7d32" : "#c8102e";
      const direction = String(s.direction || "neutral");
      const total = Math.max(1, Number(s.article_count || 0));
      const bull = Number(s.bull_count || 0);
      const bear = Number(s.bear_count || 0);
      const neutral = Number(s.neutral_count || 0);
      const bullPct = Math.round((bull / total) * 100);
      const bearPct = Math.round((bear / total) * 100);
      const neutralPct = Math.max(0, 100 - bullPct - bearPct);
      const topThemes = (s.top_themes || []).slice(0, 3);
      const sampleEvidence = (s.sample_evidence || []).slice(0, 3);

      const themesHtml = topThemes.length
        ? topThemes.map((t, i) => `
            <div style="padding:8px 0; border-bottom:${i < topThemes.length - 1 ? "1px solid #e8e4dc" : "none"};">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <span style="font-family:'DM Sans',sans-serif; font-size:12px; color:#2a2a2a;">${escHtml(t)}</span>
                <span style="font-family:'DM Mono',monospace; font-size:10px; color:#888;">—</span>
              </div>
            </div>
          `).join("")
        : '<div style="font-family:\'DM Sans\',sans-serif; font-size:12px; color:#aaa;">No dominant themes.</div>';

      const subHtml = sectorKey === "technology" && s.sub_sectors
        ? `
          <div style="margin-top:12px; border-top:1px solid #e8e4dc; padding-top:10px;">
            ${Object.entries(s.sub_sectors).map(([subKey, ss]) => {
              const subScore = Number(ss.score || 0);
              const subScoreColor = Math.abs(subScore) < 0.05 ? "#888" : subScore > 0 ? "#2e7d32" : "#c8102e";
              return `
                <div style="display:grid; grid-template-columns:1fr auto auto auto; gap:8px; align-items:center; padding:5px 0;">
                  <span style="font-family:'DM Sans',sans-serif; font-size:11px; color:#2a2a2a;">${escHtml(_subSectorLabel(subKey))}</span>
                  <span style="font-family:'DM Mono',monospace; font-size:11px; color:${subScoreColor};">${subScore >= 0 ? "+" : ""}${subScore.toFixed(2)}</span>
                  <span style="font-family:'DM Mono',monospace; font-size:10px; color:#aaa;">n=${Number(ss.article_count || 0)}</span>
                  ${_directionBadgeHtml(String(ss.direction || "neutral"))}
                </div>
              `;
            }).join("")}
          </div>
        `
        : "";

      const evidenceHtml = sampleEvidence.length
        ? sampleEvidence.map((ev) => `
            <div style="border-left:2px solid #e8e4dc; padding-left:8px; margin:0 0 10px;">
              <div style="
                font-family:'DM Sans',sans-serif; font-size:12px; color:#2a2a2a; line-height:1.45;
                display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
              ">${escHtml(ev)}</div>
            </div>
          `).join("")
        : '<div style="font-family:\'DM Sans\',sans-serif; font-size:12px; color:#aaa;">No sample evidence.</div>';

      panel.innerHTML = `
        <div style="padding:16px 0 20px 0;">
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px;">
            <div>
              <div style="font-family:'DM Sans',sans-serif; font-size:10px; font-weight:600; color:#888; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;">Signal Summary</div>
              <div style="font-family:'DM Mono',monospace; font-size:32px; color:${scoreColor}; line-height:1;">${score >= 0 ? "+" : ""}${score.toFixed(2)}</div>
              <div style="margin-top:6px;">${_directionBadgeHtml(direction)}</div>
              <div style="margin-top:14px;">
                <div style="display:flex; height:8px; width:100%; border-radius:4px; overflow:hidden; background:#e8e4dc;">
                  <div style="width:${bullPct}%; background:#2e7d32;"></div>
                  <div style="width:${bearPct}%; background:#c8102e;"></div>
                  <div style="width:${neutralPct}%; background:#aaa;"></div>
                </div>
                <div style="margin-top:6px; font-family:'DM Mono',monospace; font-size:10px; color:#888;">
                  ${bull}↑ bull&nbsp;&nbsp;${bear}↓ bear&nbsp;&nbsp;${neutral}— neutral
                </div>
              </div>
              <div style="margin-top:10px; font-family:'DM Mono',monospace; font-size:10px; color:#aaa;">
                ${Number(s.article_count || 0)} articles · ${Number(s.source_a_count || 0)} from news feed · ${Number(s.source_b_count || 0)} from signals
              </div>
              <div style="margin-top:8px;">${_convictionBadgeHtml(String(s.conviction || "low"))}</div>
            </div>
            <div>
              <div style="font-family:'DM Sans',sans-serif; font-size:10px; font-weight:600; color:#888; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;">Top Themes</div>
              ${themesHtml}
              ${subHtml}
            </div>
            <div>
              <div style="font-family:'DM Sans',sans-serif; font-size:10px; font-weight:600; color:#888; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;">Signal Evidence</div>
              ${evidenceHtml}
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; padding-top:4px;">
            <button onclick="event.stopPropagation(); showDetailView('${escHtml(sectorKey)}')" style="
              border:none;
              background:none;
              cursor:pointer;
              padding:0 0 4px 0;
              font-family:'DM Sans',sans-serif;
              font-size:11px;
              color:#c8102e;
              text-decoration:none;
            ">→ Full Analysis</button>
          </div>
        </div>
      `;
      return panel;
    }

    function _closeOpenSectorPanel() {
      return new Promise((resolve) => {
        if (!openSectorPanelEl) {
          resolve();
          return;
        }
        const panel = openSectorPanelEl;
        const prevRow = openSectorRowEl;
        openSectorPanelEl = null;
        openSectorRowEl = null;
        openSectorKey = null;
        if (prevRow) prevRow.style.borderLeftColor = "transparent";
        panel.style.opacity = "0";
        panel.style.maxHeight = "0";
        panel.style.padding = "0";
        setTimeout(() => {
          if (panel.parentNode) panel.parentNode.removeChild(panel);
          resolve();
        }, 210);
      });
    }

    async function toggleSectorDetailPanel(sectorKey, rowEl) {
      const sectorData = sectorScoresData && sectorScoresData.sectors
        ? sectorScoresData.sectors[sectorKey]
        : null;
      if (!sectorData) return;

      if (openSectorKey === sectorKey) {
        await _closeOpenSectorPanel();
        return;
      }

      await _closeOpenSectorPanel();

      rowEl.style.borderLeftColor = "#c8102e";
      const panel = _buildSectorDetailPanel(sectorKey, sectorData);
      _insertPanelAfterRow(sectorKey, rowEl, panel);
      openSectorPanelEl = panel;
      openSectorRowEl = rowEl;
      openSectorKey = sectorKey;

      requestAnimationFrame(() => {
        panel.style.padding = "16px 0 20px 0";
        panel.style.maxHeight = "400px";
        panel.style.opacity = "1";
      });
    }

    async function showDetailView(sectorKey) {
      const scorecardView = document.getElementById("signals-scorecard-view");
      const detailView = document.getElementById("signals-detail-view");
      const themeView = document.getElementById("signals-theme-view");
      if (!scorecardView || !detailView) return;
      if (themeView) {
        themeView.style.display = "none";
        themeView.innerHTML = "";
      }
      openThemeId = null;
      openThemeName = null;
      openThemeSectorKey = null;
      const sectorData = sectorScoresData && sectorScoresData.sectors
        ? sectorScoresData.sectors[sectorKey]
        : null;
      if (!sectorData) return;
      await _closeOpenSectorPanel();
      currentDetailSectorKey = sectorKey;
      scorecardView.style.display = "none";
      detailView.style.display = "block";
      renderSectorDetailView(sectorKey, sectorData);
    }

    function showThemeView(themeId, themeName, sectorKey) {
      const scorecardView = document.getElementById("signals-scorecard-view");
      const detailView = document.getElementById("signals-detail-view");
      const themeView = document.getElementById("signals-theme-view");
      if (!scorecardView || !detailView || !themeView) return;
      openThemeId = themeId;
      openThemeName = themeName;
      openThemeSectorKey = sectorKey;
      scorecardView.style.display = "none";
      detailView.style.display = "none";

                font-size:11px;

        <section>

            <div style="background:#f0faf0; border-radius:6px; padding:16px;">
              <div style="font-family:'DM Sans',sans-serif; font-size:12px; color:#2e7d32; font-weight:600; margin-bottom:12px;">

            <div style="background:#fdf0f0; border-radius:6px; padding:16px;">

              </div>
              ${_renderBullBearItems(s, "bearish")}

          </div>

        <section>
          ${_detailSectionHeader("Themes & Tickers")}
          <div id="themes-detail-grid"></div>
        </section>

      const themesWrap = detailView.querySelector("#themes-detail-grid");

        themesWrap.innerHTML = '<div style="font-family:\'DM Mono\',monospace; font-size:11px; color:#aaa;">No theme detail available</div>';

          const chips = (t.tickers || []).slice(0, 6).map((tk) => `
            <span style="
              font-family:'DM Mono',monospace;
              font-size:10px;
              background:#f0f0f0;
              color:#2a2a2a;
              border-radius:3px;
              padding:2px 5px;
              margin-right:4px;
              display:inline-block;
              margin-bottom:4px;

              display:grid;
              grid-template-columns:1fr 80px 80px auto 24px;
              gap:10px;
              align-items:center;
              padding:10px 8px;

              cursor:pointer;

        const labels = trendOldestToNewest.map((p) => _formatWeekLabel(String(p.week_start || "")));

              borderColor: directionColor,
              backgroundColor: _chartFillColor(direction),

              tension: 0.25,
              pointRadius: 3,
              pointHoverRadius: 3,
              pointBackgroundColor: directionColor,
              pointBorderColor: directionColor,
              borderWidth: 1.8,

            responsive: true,

            scales: {
              x: {
                grid: { display: false, drawBorder: false },
                ticks: {
                  color: "#aaa",
                  font: { family: "DM Mono", size: 10 },
                  autoSkip: false,
                  maxRotation: 0,
                },
                border: { display: false },
              },
              y: {
                min: -1.0,
                max: 1.0,
                ticks: {
                  stepSize: 0.5,
                  color: "#aaa",
                  font: { family: "DM Mono", size: 10 },

                grid: {
                  drawBorder: false,
                  color: (ctx) => (ctx.tick && ctx.tick.value === 0 ? "#e8e4dc" : "rgba(232,228,220,0.45)"),
                  lineWidth: (ctx) => (ctx.tick && ctx.tick.value === 0 ? 1.5 : 1),

      } catch (err) {
        const wrap = detailView.querySelector("#sector-trend-wrap");

      }
    }

    async function renderThemeView(themeId, themeName, sectorKey) {

                    font-size: 11px; color: #aaa;">Loading articles...</div>
      `;

      const sectorLabel = SECTOR_LABELS[sectorKey] || sectorKey;
      let data;
      try {
        const res = await fetch(
          "/api/signals/theme-articles?themeId=" + encodeURIComponent(themeId) + "&limit=20"
        );
        data = await res.json();
        if (!res.ok) {
          container.innerHTML = `
            <div style="padding:24px 0;font-family:'DM Mono',monospace;font-size:11px;color:#aaa;">
              ${escHtml(data.error || "Request failed")}
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div style="padding:24px 0;font-family:'DM Mono',monospace;font-size:11px;color:#c8102e;">

          </div>

            ${escHtml(data.error)}

                  font-size:14px;

                ${summary ? `

                    font-size:12px;
                    color:#666;
                    line-height:1.45;

                    overflow:hidden;
                  ">${escHtml(summary)}</div>

                <div style="margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;">
                  ${_directionBadgeHtmlSmall(sentDir)}
                  <span style="font-family:'DM Mono',monospace;font-size:10px;color:#aaa;margin-left:8px;">match: ${ms.toFixed(2)}</span>
                </div>
              </div>
            `;
          }).join("")
        : `
          <div style="font-family:'DM Mono',monospace;font-size:11px;color:#aaa;padding:12px 0;">

      const builtHTML = `

                padding:0;
              ">← Back to ${escHtml(sectorLabel)}</button>
              <div style="font-family:'Playfair Display',serif; font-size:22px; color:#2a2a2a;">${escHtml(themeName || "")}</div>
            </div>
            <div style="font-family:'DM Mono',monospace; font-size:11px; color:#aaa;">
              ${totalCount} articles

          </div>

        <div id="theme-brief-card" style="

          margin-bottom: 24px;
          background: #fff;
        ">
          <div id="theme-brief-collapsed" style="padding:16px 20px;">
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font-family:'DM Mono',monospace; font-size:10px; color:#c8102e; font-weight:600;">AI BRIEF</span>
              <span style="font-family:'DM Sans',sans-serif; font-size:10px; color:#aaa;">·</span>
              <span style="font-family:'DM Sans',sans-serif; font-size:10px; color:#888;">${escHtml(themeName || "")}</span>
              <span style="font-family:'DM Sans',sans-serif; font-size:10px; color:#aaa;">·</span>

              margin-top: 8px;

              <button onclick="regenerateThemeBrief()"
                      style="font-family:'DM Sans',sans-serif; font-size:11px;
                             color:#c8102e; background:none; border:none;
                             cursor:pointer; padding:0;">
                ↻ Regenerate
              </button>
            </div>
          </div>
        </div>
        <div>${rowsHtml}</div>

    async function refreshSectorScores() {
      const btn = document.getElementById("scorecard-refresh-btn");
      if (!btn) return;
      btn.textContent = "↻ Running...";
      btn.style.color = "#aaa";
      try {
        const res = await fetch("/api/signals/sector-scores/refresh", { method: "POST" });
        const data = await res.json();
        if (data.success) {
          await loadSectorScores();
        } else {
          console.error("Refresh failed:", data.error);
        }
      } catch (e) {
        console.error("Refresh failed:", e);
      } finally {
        btn.textContent = "↻ Refresh";
        btn.style.color = "#c8102e";
      }
    }

    function renderPaneSignals(sig) {
      const section = document.getElementById("pane-signal-section");
      if (!section) return;

      const topSectors = (sig.sector_signals || [])
        .sort((a, b) => b.confidence - a.confidence)
        .slice(0, 5);

      const entities = (sig.entities || []).slice(0, 6)
        .map((e) => escHtml(e.name || "")).join(" · ");

      const actions = (sig.actions || []).slice(0, 3).map((a) => {
        const parts = [a.subject, a.verb, a.object, a.magnitude].filter(Boolean).join(" ");
        return `<li style="margin-bottom:3px;">${escHtml(parts)}</li>`;
      }).join("");

      const quant = (sig.quantitative || []).slice(0, 4).map((q) => {
        const arrow = q.direction === "up" ? "▲" : q.direction === "down" ? "▼" : "";
        const dirColor = q.direction === "up" ? "#2d7a3a"
          : q.direction === "down" ? "var(--accent)" : "var(--ink-muted)";
        return `<span style="
          font-family:'DM Mono',monospace; font-size:11px;
          color:${dirColor}; background:var(--paper);
          border:1px solid var(--border); padding:2px 6px;
          margin-right:4px; display:inline-block; margin-bottom:4px;
        ">${arrow} ${escHtml(q.metric || "")} ${q.value != null ? q.value : ""} ${escHtml(q.unit || "")}</span>`;
      }).join("");

      const sectorBars = topSectors.map((s) => {
        const label = s.sector.replace(/\./g, " › ").replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
        const dirColor = s.direction === "bullish" ? "#2d7a3a"
          : s.direction === "bearish" ? "var(--accent)"
          : "var(--ink-muted)";
        const arrow = s.direction === "bullish" ? "▲" : s.direction === "bearish" ? "▼" : "—";
        const barWidth = Math.round(s.confidence * 100);
        return `
          <div style="margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between;
              align-items:center; margin-bottom:3px;">
              <span style="font-family:'DM Sans',sans-serif; font-size:11px;

              <span style="font-family:'DM Mono',monospace; font-size:11px;
                color:${dirColor};">${arrow} ${s.confidence.toFixed(2)}</span>

            <div style="height:3px; background:var(--border);">
              <div style="height:100%; width:${barWidth}%;
                background:${dirColor};"></div>
            </div>
            ${s.evidence ? `
              <div style="font-family:'DM Sans',sans-serif; font-size:10px;
                color:var(--ink-muted); margin-top:3px; font-style:italic;">
                ${escHtml(s.evidence)}
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      const geoScore = sig.geopolitical_risk_score || 0;
      const impactScore = sig.market_impact_score || 0;

      const impactWidth = Math.round(impactScore * 100);
      const geoColor = geoScore >= 0.7 ? "var(--accent)" : "var(--ink-muted)";
      const impactColor = impactScore >= 0.7 ? "var(--accent)" : "var(--ink-muted)";

      section.style.display = "block";
      section.innerHTML = `
        <div style="
          margin:20px 0;
          padding:20px;
          background:var(--paper);
          border-left:3px solid var(--accent);
        ">
          <div style="font-family:'DM Sans',sans-serif; font-size:10px;
            letter-spacing:0.1em; text-transform:uppercase;
            color:var(--accent); margin-bottom:16px;">
            Extracted Signals
          </div>

          ${sig.summary_signal ? `
            <div style="font-family:'DM Sans',sans-serif; font-size:13px;
              color:var(--ink); font-style:italic; line-height:1.5;
              margin-bottom:16px; padding-bottom:16px;
              border-bottom:1px solid var(--border);">
              "${escHtml(sig.summary_signal)}"
            </div>
          ` : ""}

          <div style="margin-bottom:16px; padding-bottom:16px;
            border-bottom:1px solid var(--border);">
            ${sectorBars}
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr;
            gap:12px; margin-bottom:16px; padding-bottom:16px;
            border-bottom:1px solid var(--border);">
            <div>
              <div style="font-family:'DM Sans',sans-serif; font-size:10px;
                letter-spacing:0.06em; text-transform:uppercase;
                color:var(--ink-muted); margin-bottom:4px;">
                Geopolitical Risk
              </div>
              <div style="height:4px; background:var(--border); margin-bottom:3px;">
                <div style="height:100%; width:${geoWidth}%;
                  background:${geoColor};"></div>
              </div>
              <div style="font-family:'DM Mono',monospace; font-size:11px;
                color:${geoColor};">${geoScore.toFixed(2)}</div>
            </div>
            <div>
              <div style="font-family:'DM Sans',sans-serif; font-size:10px;
                letter-spacing:0.06em; text-transform:uppercase;

          ${entities ? `

            </div>
          ` : ""}

          ${actions ? `

              <div style="font-family:'DM Sans',sans-serif; font-size:10px;

              <ul style="margin:0; padding-left:16px;

          ${quant ? `
            <div>
              <div style="font-family:'DM Sans',sans-serif; font-size:10px;
                letter-spacing:0.06em; text-transform:uppercase;
                color:var(--ink-muted); margin-bottom:6px;">Numbers</div>
              <div>${quant}</div>
            </div>
          ` : ""}
        </div>
      `;
    }

    function switchTab(tab) {
      if (activeTab === "signals" && tab !== "signals") {
        showScorecardView();
      }
      activeTab = tab;
      if (currentQuery) clearSearch();
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      document.getElementById("news-panel").style.display = tab === "news" ? "block" : "none";
      document.getElementById("events-panel").style.display = tab === "events" ? "block" : "none";
      document.getElementById("signals-panel").style.display = tab === "signals" ? "block" : "none";
      document.getElementById("topic-filter-wrapper").style.display = tab === "news" ? "flex" : "none";
      document.getElementById("refresh-feed-btn").style.display = tab === "news" ? "inline-block" : "none";
      document.getElementById("personalisation-toggle").style.display = tab === "news" ? "flex" : "none";
      if (tab === "news" && !newsLoaded) loadNews();
      if (tab === "events" && !eventsLoaded) loadEvents();
      if (tab === "signals" && !signalsLoaded) loadSignalsTab();
      if (tab === "signals") loadSectorScores();
    }

    function updateDigestContextIndicator() {
      const indicator = document.getElementById("digest-context-indicator");
      if (!indicator) return;
      if (currentSearchResults.length > 0 && currentQuery) {
        indicator.textContent = `· scoped to "${currentQuery}" (${currentSearchResults.length} items)`;
        indicator.style.display = "inline";
      } else {
        indicator.style.display = "none";
      }
    }

    function updateFlashNoteState() {
      const btn = document.getElementById("flash-note-btn");
      if (!btn) return;

      const hasSelectedItem = currentPaneItem !== null;
      const hasSearchResult = currentSearchResults.length > 0;
      const item = currentPaneItem || currentSearchResults[0] || null;
      const hasContent = !!(
        item &&
        ((item.description && item.description.length > 30) ||
          (item.url && item.url.length > 0))
      );

      if ((hasSelectedItem || hasSearchResult) && hasContent) {
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.cursor = "pointer";
        btn.title = item.description
          ? `Flash note on: ${(item.title || "").slice(0, 50)}`
          : "Flash note (will fetch article first)";
      } else if ((hasSelectedItem || hasSearchResult) && !hasContent) {
        btn.disabled = true;
        btn.style.opacity = "0.4";
        btn.style.cursor = "default";
        btn.title = "No article content available for flash note";
      } else {
        btn.disabled = true;
        btn.style.opacity = "0.4";
        btn.style.cursor = "default";
        btn.title = "Open an article or run a search first";
      }
    }

    async function handleFlashNote() {
      const targetItem = currentPaneItem || currentSearchResults[0] || null;
      if (!targetItem) return;

      let enrichedItem = { ...targetItem };

      if ((!enrichedItem.description || enrichedItem.description.length < 30) && enrichedItem.url) {
        showDigestLoading();
        try {
          const res = await fetch(
            "/api/news/article/fetch?url=" + encodeURIComponent(enrichedItem.url)
          );
          const data = await res.json();
          if (data.success && data.text && data.text.length > 100) {
            enrichedItem.description = data.text.slice(0, 300).trim();
          }
        } catch (e) {
          // Continue without enrichment
        }
      }

      if (!enrichedItem.description || enrichedItem.description.length < 30) {
        showToast("Not enough article content for a flash note — try opening the article first");
        return;
      }

      showDigestLoading();
      const body = {
        format: "flash_note",
        model: "llama3",
        context_items: [enrichedItem],
      };

      try {
        const res = await fetch("/api/news/digest/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        showDigestResult(data);
      } catch (e) {
        showDigestError(e);
      }
    }

    async function performSearch(query) {
      if (query === currentQuery) return;
      currentQuery = query;

      document.getElementById("search-results-panel").style.display = "block";
      document.getElementById("tabs-bar").style.display = "block";
      document.getElementById("news-panel").style.display = "none";
      document.getElementById("events-panel").style.display = "none";

      document.getElementById("search-loading").style.display = "block";
      document.getElementById("search-results-grid").innerHTML = "";
      document.getElementById("search-no-results").style.display = "none";
      document.getElementById("search-results-label").textContent = `Searching for "${query}"...`;

      try {
        const res = await fetch(`/api/news/search?q=${encodeURIComponent(query)}&limit=30`);
        const data = await res.json();
        currentSearchResults = data.items || [];
        const topicInput = document.getElementById("topicInput");
        if (
          topicInput &&
          document.getElementById("topicInline").style.display === "flex" &&
          !topicInput.value.trim()
        ) {
          topicInput.value = currentQuery;
        }
        updateDigestContextIndicator();
        updateFlashNoteState();

        document.getElementById("search-loading").style.display = "none";

        if (!currentSearchResults.length) {
          document.getElementById("search-no-results").style.display = "block";
          document.getElementById("search-results-label").textContent = `No results for "${query}"`;
          return;
        }

        document.getElementById("search-results-label").textContent =
          `${data.total} results for "${query}" - searched ${data.searched} items`;

        const grid = document.getElementById("search-results-grid");
        currentSearchResults.forEach((item) => {
          grid.appendChild(renderSearchResult(item));
        });
      } catch (err) {
        currentSearchResults = [];
        updateDigestContextIndicator();
        updateFlashNoteState();
        document.getElementById("search-loading").style.display = "none";
        document.getElementById("search-results-label").textContent = "Search failed.";
      }
    }

    function renderSearchResult(item) {
      const card = document.createElement("div");
      card.style.cssText = `
        background: var(--paper-card); padding: 16px 18px;
        cursor: pointer;
        border-top: 2px solid transparent;
        transition: border-top-color 0.15s;
      `;
      card.addEventListener("mouseenter", () => {
        card.style.borderTopColor = "var(--accent)";
      });
      card.addEventListener("mouseleave", () => {
        card.style.borderTopColor = "transparent";
      });
      card.addEventListener("click", () => openArticlePane(item));

      const typeBadge = item.item_type === "event"
        ? `<span style="
            font-family:'DM Sans',sans-serif; font-size:10px;
            background:var(--accent-soft); color:var(--accent);
            border:1px solid var(--accent); padding:1px 5px;
            border-radius:2px; margin-left:6px; vertical-align:middle;
          ">EVENT</span>`
        : "";

      const title = item.item_type === "event"
        ? toTitleCase(item.title || "")
        : (item.title || "");

      card.innerHTML = `
        <div style="
          font-family:'DM Sans',sans-serif; font-size:11px;
          color:var(--ink-muted); margin-bottom:8px;
          display:flex; justify-content:space-between; align-items:center;
        ">
          <span>${escHtml(item.source_name || "")} · ${escHtml(item.topic || "")}${typeBadge}</span>
          <span>${fmtDate(item.date_published || "")}</span>
        </div>
        <div style="
          font-family:'Playfair Display',serif; font-size:15px;
          font-weight:400; line-height:1.35; color:var(--ink); margin-bottom:8px;
        ">${escHtml(title)}</div>
        ${item.description ? `<div style="
          font-family:'DM Sans',sans-serif; font-size:12px;
          color:var(--ink-muted); line-height:1.5;
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
          overflow:hidden;
        ">${escHtml(item.description)}</div>` : ""}
        <div style="margin-top:10px;">
          <span style="
            font-family:'DM Sans',sans-serif; font-size:12px; color:var(--accent);
          ">${item.item_type === "event" ? "Register →" : "Read →"}</span>
        </div>
      `;
      return card;
    }

    function clearSearch() {
      currentQuery = "";
      currentSearchResults = [];
      document.getElementById("search-input").value = "";
      document.getElementById("search-clear").style.display = "none";
      document.getElementById("search-results-panel").style.display = "none";
      document.getElementById("tabs-bar").style.display = "block";
      updateDigestContextIndicator();
      updateFlashNoteState();
      if (activeTab === "news") {
        document.getElementById("news-panel").style.display = "block";
      } else {
        document.getElementById("events-panel").style.display = "block";
      }
    }

    function bindUI() {
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePane();
      });

      document.getElementById("refreshBtn").addEventListener("click", async () => {
        try {
          await api("/api/news/refresh", { method: "POST" });
          newsLoaded = false;
          eventsLoaded = false;
          await Promise.all([loadStats(), loadTopics(), loadSignals()]);
          if (activeTab === "news") await loadNews();
          else await loadEvents();
        } catch (e) {
          showToast("Refresh failed");
        }
      });

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
      });

      document.getElementById("search-input").addEventListener("focus", () => {
        document.getElementById("search-wrapper").style.borderColor = "var(--accent)";
      });
      document.getElementById("search-input").addEventListener("blur", () => {
        document.getElementById("search-wrapper").style.borderColor = "var(--border)";
      });
      document.getElementById("search-input").addEventListener("input", function () {
        const q = this.value.trim();
        document.getElementById("search-clear").style.display = q ? "block" : "none";

        clearTimeout(searchTimeout);
        if (!q) {
          clearSearch();
          return;
        }
        searchTimeout = setTimeout(() => performSearch(q), 400);
      });
      document.getElementById("search-input").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          clearTimeout(searchTimeout);
          const q = this.value.trim();
          if (q) performSearch(q);
        }
        if (e.key === "Escape") clearSearch();
      });

      document.getElementById("topicSelect").addEventListener("change", async (e) => {
        currentTopic = e.target.value || "";
        newsLoaded = false;
        await loadNews();
      });

      document.addEventListener("click", function (e) {
        const aiBtn = document.getElementById("ai-toggle-btn");
        const aiDrop = document.getElementById("ai-dropdown");
        const dataBtn = document.getElementById("data-toggle-btn");
        const dataPop = document.getElementById("data-popover");
        if (aiDropdownOpen && aiBtn && aiDrop && !aiBtn.contains(e.target) && !aiDrop.contains(e.target)) {
          aiDropdownOpen = false;
          aiDrop.style.display = "none";
          document.getElementById("ai-toggle-chevron").style.transform = "rotate(0deg)";
          aiBtn.style.borderColor = "var(--border)";
          aiBtn.style.color = "var(--ink-muted)";
        }
        if (dataPopoverOpen && dataBtn && dataPop && !dataBtn.contains(e.target) && !dataPop.contains(e.target)) {
          dataPopoverOpen = false;
          dataPop.style.display = "none";
          dataBtn.style.borderColor = "var(--border)";
          dataBtn.style.color = "var(--ink-muted)";
        }
        const prefsPanel = document.getElementById("prefs-panel");
        const settingsBtn = document.querySelector('[title="Customise topics"]');
        if (
          prefsPanelOpen &&
          prefsPanel &&
          !prefsPanel.contains(e.target) &&
          (!settingsBtn || !settingsBtn.contains(e.target))
        ) {
          closePrefsPanel();
        }
      });

      document.getElementById("news-panel").addEventListener("click", (e) => {
        const t = e.target.closest(".title-clickable, .pane-link");
        if (!t) return;
        e.preventDefault();
        const idx = Number(t.getAttribute("data-idx"));
        const item = (window.__newsPaneItems || [])[idx];
        if (item) openArticlePane(item);
      });
      document.getElementById("events-panel").addEventListener("click", (e) => {
        const t = e.target.closest(".title-clickable");
        if (!t) return;
        e.preventDefault();
        const idx = Number(t.getAttribute("data-idx"));
        const item = (window.__eventsPaneItems || [])[idx];
        if (item) openArticlePane(item);
      });
    }

    async function init() {
      bindUI();
      updateDigestContextIndicator();
      updateFlashNoteState();
      const savedPrefs = loadTopicPrefs();
      personalisationActive = savedPrefs.usePrefs !== false;
      if (!personalisationActive) {
        const btn = document.getElementById("pref-toggle-btn");
        if (btn) {
          btn.style.background = "none";
          btn.style.color = "var(--ink-muted)";
          btn.style.borderColor = "var(--border)";
          btn.textContent = "☆ For you";
        }
      }
      try {
        const state = await fetch("/api/news/pipeline/status").then((r) => r.json());
        if (state.running) {
          startPipelinePolling();
          const btn = document.getElementById("btn-pipeline");
          if (btn) {
            btn.disabled = true;
            btn.textContent = "Pipeline running...";
          }
        }
      } catch (e) {}
      await loadDataStats();
      await Promise.all([loadStats(), loadTopics(), loadSignals()]);
      await updateSignalCount();
      await loadSectorScores();
      await loadNews();
    }

    init();
  </script>
</body>
</html>
