<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storyline - Market Radar</title>
    <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="storyline-title">Storyline</h1>
            <a href="/" class="button">Back to Events</a>
        </header>
        
        <p id="storyline-description"></p>
        
        <div class="storyline-timeline" id="storyline-timeline">
            <!-- Timeline visualization -->
        </div>
        
        <div class="storyline-events" id="storyline-events">
            <!-- Events in storyline -->
        </div>
    </div>
    
    <script src="/frontend/app.js"></script>
    <script>
        // Storyline page logic (Priority 7, Phase 4)
        const urlParams = new URLSearchParams(window.location.search);
        const storylineId = urlParams.get('storyline_id');
        
        async function loadStoryline() {
            if (!storylineId) {
                document.getElementById('storyline-title').textContent = 'Storyline Not Found';
                return;
            }
            
            try {
                const response = await fetch(`/api/storylines`);
                const storylines = await response.json();
                const storyline = storylines.find(s => s.id === storylineId);
                
                if (!storyline) {
                    document.getElementById('storyline-title').textContent = 'Storyline Not Found';
                    return;
                }
                
                document.getElementById('storyline-title').textContent = storyline.title;
                document.getElementById('storyline-description').textContent = 
                    `${storyline.firm} - ${storyline.topic} (${storyline.event_count} events)`;
                
                renderStorylineTimeline(storyline);
                renderStorylineEvents(storyline);
            } catch (error) {
                document.getElementById('storyline-title').textContent = 'Error Loading Storyline';
                console.error(error);
            }
        }
        
        function renderStorylineTimeline(storyline) {
            const timeline = document.getElementById('storyline-timeline');
            
            timeline.innerHTML = storyline.events.map((event, index) => {
                const dateStr = event.date_time ? formatDate(event.date_time) : 'Date TBD';
                return `
                    <div class="timeline-item">
                        <div class="timeline-marker"></div>
                        <div class="timeline-content">
                            <div class="timeline-date">${dateStr}</div>
                            <h3><a href="${escapeHtml(event.link)}" target="_blank">${escapeHtml(event.event_name)}</a></h3>
                            <p>${escapeHtml(event.firm_name)}</p>
                            ${event.description ? `<p class="timeline-description">${escapeHtml(event.description.substring(0, 150))}...</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderStorylineEvents(storyline) {
            const container = document.getElementById('storyline-events');
            
            container.innerHTML = storyline.events.map(event => {
                const dateStr = event.date_time ? formatDate(event.date_time) : 'Date TBD';
                return `
                    <article class="conversation-card">
                        <h3><a href="${escapeHtml(event.link)}" target="_blank">${escapeHtml(event.event_name)}</a></h3>
                        <p>${escapeHtml(event.firm_name)}</p>
                        <p>${dateStr}</p>
                        ${event.description ? `<p>${escapeHtml(event.description)}</p>` : ''}
                    </article>
                `;
            }).join('');
        }
        
        function formatDate(dateStr) {
            try {
                const dt = new Date(dateStr);
                return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch {
                return dateStr;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadStoryline();
    </script>
</body>
</html>
